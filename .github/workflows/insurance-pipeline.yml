name: Insurance Lab 12 and Lab 13

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insurance-pipeline:
    name: Run Insurance MLOps Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download insurance dataset
        run: python download_dataset.py

      - name: Run Lab 13 End-to-End Pipeline
        run: python 13_end_to_end.py

      - name: Upload reports and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insurance-lab12-lab13-reports
          path: |
            reports/
            models/
          if-no-files-found: ignore